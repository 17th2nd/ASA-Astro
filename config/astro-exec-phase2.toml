schema_version = "astro-exec-config-v1"

[defaults]
policy = "no-implicit-defaults"
applied = []

[execution]
mode = "dry-run"
frozen_manifest = "config/frozen-artefacts-v1.json"

[roles.asalab]
read_roots = ["inputs/estimator"]
write_roots = ["selections/asa"]

[roles.custodian]
read_roots = ["inputs", "frozen"]
write_roots = ["custodian"]

[roles.statistician]
read_roots = ["sealed"]
write_roots = ["statistics"]

[roles.truthlab]
read_roots = ["inputs/truth", "sealed/asa"]
write_roots = ["truth"]

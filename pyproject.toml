[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asa-astro"
version = "0.1.0"
description = "Deterministic observation-to-candidate-graph proof of concept for ASA validation"
requires-python = ">=3.11"
dependencies = [
  "Pillow==10.2.0",
  "jsonschema==4.10.3",
]

[project.scripts]
asa-astro-observe = "asa_astro.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

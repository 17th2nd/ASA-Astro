[build-system]
requires = ["setuptools==68.1.2"]
build-backend = "setuptools.build_meta"

[project]
name = "asa-astro"
version = "0.1.0"
description = "Deterministic observation-to-candidate-graph proof of concept for ASA validation"
requires-python = ">=3.11"
dependencies = [
  "attrs==23.2.0",
  "Pillow==10.2.0",
  "jsonschema==4.10.3",
  "pyrsistent==0.20.0",
]

[project.scripts]
asa-astro-observe = "asa_astro.cli:main"
astro-exec = "astro_exec.cli:main"
astro = "astro.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
astro_exec = ["contracts/*.json"]
